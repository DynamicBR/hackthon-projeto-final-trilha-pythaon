<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Acesso à Loja</title>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow-sm" style="width: 25rem;">
        <h3 class="text-center mb-4">Loja Virtual</h3>
        <form method="POST" action="{{ url_for('login.acessar') }}">
            <input type="text" name="nome" class="form-control mb-3" placeholder="Seu nome" required>
            <input type="password" name="senha" class="form-control mb-4" placeholder="Sua senha" required>
            <button type="submit" name="acao" value="entrar" class="btn btn-primary w-100 mb-2">Entrar</button>
            <button type="submit" name="acao" value="cadastrar" class="btn btn-outline-secondary w-100">Cadastrar</button>
        </form>
    </div>
</body>
</html>
